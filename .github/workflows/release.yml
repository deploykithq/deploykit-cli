name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / GitHub Release
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted Publishing: npm authenticates this workflow through GitHub's
      # OIDC provider instead of a long-lived token, and stamps the published
      # tarball with provenance.
      id-token: write

    steps:
      # Publish the tagged commit, not whatever master has drifted to since
      # release-please ran.
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 20 ships npm 10, which predates Trusted Publishing. Without this
      # the publish fails on OIDC with an unhelpful authentication error.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # prepublishOnly runs clean + build, so dist/ is compiled from the tag.
      - name: Publish
        run: npm publish --access public
