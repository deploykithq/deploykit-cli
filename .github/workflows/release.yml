name: Release

on:
  push:
    branches: [master]
  # Escape hatch for re-publishing a tag release-please already cut — e.g. when
  # a publish failed for a transient reason. Re-running the failed job is not
  # enough: GitHub replays the workflow file from the commit that triggered it,
  # so a fix landed afterwards would not apply. npm's Trusted Publisher is
  # registered against this workflow file, so publishing has to stay in here
  # rather than move to a workflow of its own.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    # always() keeps this job reachable on workflow_dispatch, where
    # release-please is skipped and would otherwise skip everything downstream.
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted Publishing: npm authenticates this workflow through GitHub's
      # OIDC provider instead of a long-lived token, and stamps the published
      # tarball with provenance.
      id-token: write

    steps:
      # Publish the tagged commit, not whatever master has drifted to since
      # release-please ran.
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 20 ships npm 10, which predates Trusted Publishing (added in npm
      # 11.5.1). Pin the major: npm@latest is npm 12, which requires Node >=
      # 22.22 and refuses to install here.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # prepublishOnly runs clean + build, so dist/ is compiled from the tag.
      - name: Publish
        run: npm publish --access public
